name: Build WASM Artifacts

on:
  push:
    branches: [develop]
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - 'scripts/build-emscripten'
      - 'emscripten/**'
  workflow_dispatch:

jobs:
  build-wasm:
    name: Build and publish WASM
    runs-on: ubuntu-latest
    container: ghcr.io/openrct2/openrct2-build:26-emscripten
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build OpenRCT2 WASM
        run: bash scripts/build-emscripten

      - name: Publish artifacts to wasm-artifacts branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git config --global --add safe.directory '*'

          # Create a clean workspace for the orphan branch
          WORK=$(mktemp -d)
          cd "$WORK"
          git init

          # Copy build outputs
          cp "$GITHUB_WORKSPACE/build/www/openrct2.js"   .
          cp "$GITHUB_WORKSPACE/build/www/openrct2.wasm" .
          cp "$GITHUB_WORKSPACE/build/www/openrct2.zip"  .

          git add openrct2.js openrct2.wasm openrct2.zip
          git commit -m "wasm build: ${GITHUB_SHA::8} ($(date -u +%Y-%m-%dT%H:%M:%SZ))"

          # Force-push to the wasm-artifacts branch (consumed by browser-native-OS submodule)
          git remote add origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:wasm-artifacts --force
